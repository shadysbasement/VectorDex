<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="orbGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#bbf2f6"/>
      <stop offset="18%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#034575"/>
      <stop offset="100%" stop-color="#01223e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Chrome Rim -->
  <circle cx="50" cy="50" r="48" fill="#e2e8f0" stroke="#1e293b" stroke-width="4"/>
  <circle cx="50" cy="50" r="42" fill="#0f172a"/>
  <!-- The Glowing Cyan Orb -->
  <circle cx="50" cy="50" r="38" fill="url(#orbGrad)"/>
  <!-- Specular Reflection Highlight -->
  <ellipse cx="38" cy="34" rx="14" ry="9" fill="#ffffff" opacity="0.85" transform="rotate(-30 38 34)"/>
</svg>
